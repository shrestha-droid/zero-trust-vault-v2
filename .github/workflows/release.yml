name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No Supabase env here on purpose: the release asset is a local-only build (connect-src 'none').
      - run: npm run check
      - name: Package offline build
        run: |
          cp dist/index.html "zero-trust-vault-${GITHUB_REF_NAME}.html"
          sha256sum "zero-trust-vault-${GITHUB_REF_NAME}.html" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "zero-trust-vault-${GITHUB_REF_NAME}.html" SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes "Offline, local-only build. Open the HTML file in any modern browser; no network or server needed. Verify with: \`shasum -a 256 -c SHA256SUMS.txt\`"
