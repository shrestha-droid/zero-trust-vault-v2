    <style>
        :root {
            --bg-pure: #000000;
            --bg-input: #0a0a0a;
            --fg-main: #e0e0e0;
            --fg-muted: #666666;
            --border-faint: #222222;
            --border-focus: #ffffff;
            --danger-text: #ff4444;
            --danger-border: #441111;
            --danger-bg: #110000;
            --font-mono: 'Courier New', Courier, 'Liberation Mono', monospace;
            --font-sans: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-pure); color: var(--fg-main); font-family: var(--font-sans); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 3rem 1.5rem; -webkit-font-smoothing: antialiased; }
        label, .section-title { font-family: var(--font-mono); font-size: 0.65rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.15em; }
        .main-header { font-family: var(--font-sans); font-size: 1.0rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg-main); display: flex; align-items: center; gap: 0.75rem; }
        .main-header::before { content: "■"; font-size: 0.8rem; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 1.75rem; animation: fadeIn 0.4s ease-out; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        
        input[type="text"], input[type="password"], input[type="email"], input[type="number"], textarea, select { background-color: var(--bg-input); border: 1px solid var(--border-faint); color: var(--fg-main); padding: 0.75rem 1rem; font-family: var(--font-mono); font-size: 0.8rem; border-radius: 0; transition: border-color 0.2s, background-color 0.2s; outline: none; width: 100%; }
        input:focus, textarea:focus, select:focus { border-color: var(--border-focus); background-color: #000; }
        input::placeholder, textarea::placeholder { color: #333333; }
        
        .radio-group { display: flex; align-items: center; gap: 2rem; padding: 0.25rem 0; }
        .radio-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--fg-main); font-size: 0.75rem; font-family: var(--font-mono); }
        .radio-label input[type="radio"] { appearance: none; width: 12px; height: 12px; border: 1px solid var(--fg-muted); border-radius: 50%; background: transparent; cursor: pointer; padding: 0; display: grid; place-content: center; }
        .radio-label input[type="radio"]::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--fg-main); transform: scale(0); transition: transform 0.1s; }
        .radio-label input[type="radio"]:checked { border-color: var(--fg-main); }
        .radio-label input[type="radio"]:checked::before { transform: scale(1); }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-top: 0.5rem; }
        button { background-color: transparent; border: 1px solid var(--border-faint); color: var(--fg-main); padding: 0.9rem; font-family: var(--font-sans); font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; border-radius: 0; transition: all 0.2s; }
        button:hover { background-color: var(--border-faint); }
        button.danger { border-color: var(--danger-border); color: var(--danger-text); }
        button.danger:hover { background-color: var(--danger-bg); border-color: var(--danger-text); }
        
        .dropzone { border: 1px dashed var(--border-faint); padding: 1.2rem; text-align: center; cursor: pointer; color: var(--fg-muted); font-family: var(--font-mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.2s; background: var(--bg-input); }
        .dropzone:hover { color: var(--fg-main); border-color: var(--border-focus); }
        
        .terminal-container { border: 1px solid var(--border-faint); display: flex; flex-direction: column; margin-top: 0.5rem; }
        .terminal-header { padding: 0.6rem 1rem; border-bottom: 1px dashed var(--border-faint); }
        pre.console { padding: 1rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--fg-muted); max-height: 200px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; word-break: break-all; }
        
        .qr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 0.5rem; }
        .qr-card { border: 1px solid var(--border-faint); padding: 0.75rem; text-align: center; display: flex; flex-direction: column; gap: 0.5rem; background: var(--bg-pure); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; gap: 1rem; } .action-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="login-view" class="container" style="max-width: 480px; margin-top: 5vh;">
        <div class="main-header">Authentication Perimeter</div>
        <div class="form-group"><label>Identity (Corporate Email)</label><input type="email" id="auth-email" placeholder="agent@internal" autocomplete="off"></div>
        <div class="form-group"><label>Session Passcode</label><input type="password" id="auth-password" placeholder="••••••••••••"></div>
        <div class="grid-2" style="margin-top: 0.5rem;">
            <button onclick="window.handleSignIn()">Establish Session</button>
            <button onclick="window.handleSignUp()">Register Identity</button>
        </div>
        <button style="border-color: transparent; color: var(--fg-muted); margin-top: 0.5rem;" onclick="window.bypassToLocalMode()">
            [ OVERRIDE: INITIATE LOCAL AIR-GAP MODE ]
        </button>
    </div>

    <div id="vault-view" class="container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-faint); padding-bottom: 0.75rem;">
            <div class="main-header" style="margin: 0;">ZERO-TRUST PROTOCOL</div>
            <button style="border: none; padding: 0; font-size: 0.65rem;" onclick="window.lockVault()">[ SEVER CONNECTION ]</button>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Vault Identifier (Auto-generated if empty)</label>
                <input type="text" id="record-id" placeholder="e.g., core_architecture_v2">
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>Cloud Vault Directory</label>
                    <button onclick="window.triggerCloudSync()" style="padding: 0.1rem 0.5rem; font-size: 0.6rem; border-color: var(--border-faint);">SYNC</button>
                </div>
                <select id="sync-status" disabled style="background-color: var(--bg-input); color: var(--fg-muted);">
                    <option value="">-- Awaiting Sync --</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Topology (Nodes / Threshold)</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                    <input type="number" id="total-shards" value="5" title="Total Nodes (N)">
                    <input type="number" id="threshold" value="3" title="Threshold (K)">
                </div>
            </div>
            <div class="form-group">
                <label>Text Payload</label>
                <input type="text" id="secret-input" placeholder="Enter strictly private strings...">
            </div>
        </div>

        <div class="grid-2" id="kdf-row">
            <div class="form-group">
                <label>Cryptographic Vector (KDF)</label>
                <select id="kdf-mode" onchange="window.toggleKdfInput(this.value)">
                    <option value="csprng">Hardware CSPRNG (Pure Random)</option>
                    <option value="argon2id">Argon2id Wasm (Memory-Hard)</option>
                    <option value="pbkdf2">PBKDF2-SHA512 (250k)</option>
                </select>
            </div>
            <div class="form-group" id="passphrase-group" style="display: none;">
                <label>Master Passphrase</label>
                <input type="password" id="master-passphrase" placeholder="Enter high-entropy cipher...">
            </div>
        </div>

        <div class="form-group">
            <label>Binary Payload (File attachment)</label>
            <div class="dropzone" onclick="document.getElementById('file-input').click()">
                Drop file to stage, or click to browse (e.g., c++.cpp)
                <input type="file" id="file-input" style="display: none;" onchange="window.handleFileSelect(this)">
            </div>
            <div id="file-indicator" style="font-family: var(--font-mono); font-size: 0.6rem; color: var(--fg-main); text-align: center; text-transform: uppercase;"></div>
        </div>

        <div class="form-group">
            <label>Cryptographic Shards (Paste keys or drop .key files here)</label>
            <textarea id="master-key-input" rows="3" placeholder="Paste structural keys or drop your .key files here..."></textarea>
        </div>

        <div class="form-group" style="border-top: 1px solid var(--border-faint); border-bottom: 1px solid var(--border-faint); padding: 1rem 0;">
            <label>Perimeter Defense</label>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="storage" value="cloud" checked> HYBRID CLOUD</label>
                <label class="radio-label"><input type="radio" name="storage" value="local"> LOCAL AIR-GAP</label>
            </div>
        </div>

        <div class="action-grid">
            <button onclick="window.encryptAndCommit()">Encrypt & Commit</button>
            <button onclick="window.reconstructAndDecrypt()">Fetch & Reconstruct</button>
            <button class="danger" onclick="window.deleteVaultRecord()">Authorize Burn</button>
        </div>

        <div id="qr-container" class="qr-grid" style="display: none;"></div>
        
        <div class="grid-2" id="shard-actions" style="display: none;">
            <button style="border-color: var(--border-focus); width: 100%; grid-column: span 2;" onclick="window.downloadShards()">[ DOWNLOAD .KEY FILES ]</button>
        </div>

        <div class="terminal-container">
            <div class="terminal-header"><label>Terminal Output</label></div>
            <pre class="console" id="console-log">INITIATING SECURE ENVIRONMENT...&#10;ZERO-TRUST PROTOCOLS ACTIVE.</pre>
        </div>
    </div>

    <script type="module">
        import { argon2id } from "https://cdn.jsdelivr.net/npm/hash-wasm@4/dist/index.esm.min.js";

        const SUPABASE_URL = "https://lbeamrjqvkedblkgluie.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiZWFtcmpxdmtlZGJsa2dsdWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Mjk4MDEsImV4cCI6MjEwMDIwNTgwMX0.VVRygq6-9fIQcRA9W2z1jRzdQgoYgfk_S7jYLrzHobs";

        try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storage: window.sessionStorage } }); } 
        catch (e) { console.warn("Supabase client running offline."); }

        let selectedFilePayload = null;
        window.activeShares = null; // Sanitized global state tracking

        // --- AIR-GAP MASTER STATE ---
        window.IS_AIR_GAPPED = false;

        window.enforceAirGap = function() {
            window.IS_AIR_GAPPED = true;
            const cloudRadio = document.querySelector('input[name="storage"][value="cloud"]');
            const localRadio = document.querySelector('input[name="storage"][value="local"]');
            
            if (localRadio) localRadio.checked = true;
            if (cloudRadio) cloudRadio.disabled = true;
            
            localStorage.setItem('vault_storage_mode', 'AIR_GAP');
            printToConsole("[SECURITY] AIR-GAP LOCKED. CLOUD CONNECTIVITY SEVERED.");
        }

        function printToConsole(msg) {
            const box = document.getElementById('console-log');
            const time = new Date().toTimeString().split(' ')[0];
            box.innerText += `\n[${time}] ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Check if the vault was previously locked into Air-Gap mode
            if (localStorage.getItem('vault_storage_mode') === 'AIR_GAP') {
                window.enforceAirGap();
            }

            const keyInput = document.getElementById('master-key-input');
            
            keyInput.addEventListener('dragover', (e) => { e.preventDefault(); keyInput.style.borderColor = 'var(--fg-main)'; });
            keyInput.addEventListener('dragleave', (e) => { e.preventDefault(); keyInput.style.borderColor = 'var(--border-faint)'; });
            
            keyInput.addEventListener('drop', (e) => {
                e.preventDefault();
                keyInput.style.borderColor = 'var(--border-faint)';
                
                const textData = e.dataTransfer.getData('text');
                if (textData) {
                    const currentVal = keyInput.value.trim();
                    keyInput.value = currentVal ? currentVal + '\n' + textData.trim() : textData.trim();
                    printToConsole("[SYS] CIPHER APPENDED VIA TEXT DRAG.");
                    return;
                }

                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const currentVal = keyInput.value.trim();
                        const newText = event.target.result.trim();
                        keyInput.value = currentVal ? currentVal + '\n' + newText : newText;
                        printToConsole(`[SYS] SHARD EXTRACTED FROM FILE: ${file.name}`);
                    };
                    reader.readAsText(file);
                }
            });

            if (supabaseClient) { 
                supabaseClient.auth.getSession().then(({ data: { session } }) => {
                    if (session) { window.showVaultView(); printToConsole("[SYS] SESSION VERIFIED."); }
                });
            }
        });

        window.showVaultView = function() { document.getElementById('login-view').style.display = 'none'; document.getElementById('vault-view').style.display = 'flex'; }
        window.lockVault = function() { if (supabaseClient) supabaseClient.auth.signOut(); document.getElementById('vault-view').style.display = 'none'; document.getElementById('login-view').style.display = 'flex'; printToConsole("[SYS] CONNECTION SEVERED."); }
        
        window.bypassToLocalMode = function() { 
            window.showVaultView(); 
            window.enforceAirGap(); 
        }
        
        window.toggleKdfInput = function(val) {
            const row = document.getElementById('kdf-row');
            const group = document.getElementById('passphrase-group');
            if (val === 'pbkdf2' || val === 'argon2id') {
                row.style.gridTemplateColumns = '1fr 1fr';
                group.style.display = 'flex';
            } else {
                row.style.gridTemplateColumns = '1fr';
                group.style.display = 'none';
            }
        }
        
        window.handleFileSelect = function(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedFilePayload = { isBinary: true, name: file.name, type: file.type || "application/octet-stream", data: e.target.result };
                document.getElementById('file-indicator').innerText = `BINARY STAGED: ${file.name}`;
                printToConsole(`[SYS] BINARY STAGED IN VOLATILE MEMORY: ${file.name}`);
            };
            reader.readAsDataURL(file);
        }

        window.handleSignUp = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if (!email || !password) return alert("CREDENTIALS MISSING.");
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert(`ERROR: ${error.message}`); else alert("IDENTITY PROVISIONED. VERIFY EMAIL.");
        }

        window.handleSignIn = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if (!email || !password) return alert("CREDENTIALS MISSING.");
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert(`DENIED: ${error.message}`); else { window.showVaultView(); printToConsole("[SUCCESS] ALIAS VERIFIED."); }
        }

        window.triggerCloudSync = async function() {
            try {
                if (window.IS_AIR_GAPPED) throw new Error("NETWORK SEVERED. Air-Gap mode is active.");
                if (!supabaseClient) throw new Error("Supabase offline.");
                printToConsole("[SYS] SYNCING WITH CLOUD DIRECTORY...");
                const { data, error } = await supabaseClient.storage.from('vault-store').list();
                if (error) throw error;
                
                const select = document.getElementById('sync-status');
                select.innerHTML = '<option value="">-- Select Active Vault Record --</option>';
                
                const uniqueIds = [...new Set(data.filter(f => !f.name.startsWith('.')).map(file => file.name.split('.')[0]))];
                uniqueIds.forEach(id => {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.innerText = id;
                    select.appendChild(opt);
                });
                
                select.disabled = false;
                select.onchange = (e) => { document.getElementById('record-id').value = e.target.value; };
                printToConsole(`[SUCCESS] SYNC COMPLETE. FOUND ${uniqueIds.length} REMOTE VECTORS.`);
            } catch (err) {
                printToConsole(`[ERROR] SYNC FAILED: ${err.message}`);
            }
        }

        async function deriveKeyArgon2id(passphrase, saltBytes) {
            printToConsole("[SYS] EXECUTING ARGON2ID MEMORY-HARD CIPHER...");
            const keyBytes = await argon2id({ password: passphrase, salt: saltBytes, parallelism: 1, iterations: 3, memorySize: 65536, hashLength: 32, outputType: "binary" });
            return await window.crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
        }

        async function deriveKeyPBKDF2_SHA512(passphrase, saltBytes) {
            printToConsole("[SYS] EXECUTING PBKDF2 (SHA-512)...");
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
            return await window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: saltBytes, iterations: 250000, hash: "SHA-512" },
                keyMaterial, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
            );
        }

        window.encryptAndCommit = async function() {
            try {
                if (!window.secrets) throw new Error("MATH ENGINE MISSING: Please paste secrets.js into Zone 1.");
                window.activeShares = null; // Reset stale shares

                let rawPayload;
                if (selectedFilePayload) { rawPayload = JSON.stringify(selectedFilePayload); } 
                else { rawPayload = document.getElementById('secret-input').value; }
                if (!rawPayload) throw new Error("PAYLOAD IS EMPTY.");

                let aesKey;
                const kdfMode = document.getElementById('kdf-mode').value;
                let saltArray = null;

                if (kdfMode === 'argon2id' || kdfMode === 'pbkdf2') {
                    const pass = document.getElementById('master-passphrase').value;
                    if (!pass) throw new Error("CIPHER PASSPHRASE REQUIRED.");
                    const salt = window.crypto.getRandomValues(new Uint8Array(16));
                    saltArray = Array.from(salt);
                    if (kdfMode === 'argon2id') aesKey = await deriveKeyArgon2id(pass, salt);
                    else aesKey = await deriveKeyPBKDF2_SHA512(pass, salt);
                } else {
                    printToConsole("[SYS] GENERATING CSPRNG TRUE RANDOM VECTOR...");
                    aesKey = await window.crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
                }

                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const ciphertextBuffer = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, new TextEncoder().encode(rawPayload));

                const metaObj = { 
                    originalName: selectedFilePayload ? selectedFilePayload.name : "text_payload.txt", 
                    mimeType: selectedFilePayload ? selectedFilePayload.type : "text/plain", 
                    sizeBytes: selectedFilePayload ? selectedFilePayload.data.length : rawPayload.length, 
                    salt: saltArray 
                };
                const metaIv = window.crypto.getRandomValues(new Uint8Array(12));
                const encryptedMetaBuffer = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: metaIv }, aesKey, new TextEncoder().encode(JSON.stringify(metaObj)));

                const rawKeyBuffer = await window.crypto.subtle.exportKey("raw", aesKey);
                const keyHex = Array.from(new Uint8Array(rawKeyBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

                const N = parseInt(document.getElementById('total-shards').value);
                const K = parseInt(document.getElementById('threshold').value);
                const shares = window.secrets.share(keyHex, N, K);

                let recordId = document.getElementById('record-id').value.trim();
                if (!recordId) { recordId = Array.from(window.crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join(''); }

                const vaultRecord = { iv: Array.from(iv), ciphertext: Array.from(new Uint8Array(ciphertextBuffer)) };
                const metaRecord = { iv: Array.from(metaIv), ciphertext: Array.from(new Uint8Array(encryptedMetaBuffer)) };

                printToConsole(`[SYS] INITIATING COMMIT PROTOCOL: ${recordId}`);

                // The Guard Clause: If true air-gap is active, forcefully override to local storage.
                if (window.IS_AIR_GAPPED || document.querySelector('input[name="storage"]:checked').value === 'local') {
                    localStorage.setItem(`vault_${recordId}`, JSON.stringify(vaultRecord));
                    localStorage.setItem(`meta_${recordId}`, JSON.stringify(metaRecord));
                    printToConsole(`[SUCCESS] RECORD COMMITTED TO LOCAL AIR-GAP.`);
                } else {
                    printToConsole("[SYS] STREAMING ENCRYPTED CIPHERTEXT...");
                    await supabaseClient.storage.from('vault-store').upload(`${recordId}.enc`, new Blob([JSON.stringify(vaultRecord)]));
                    await supabaseClient.storage.from('vault-store').upload(`${recordId}.meta`, new Blob([JSON.stringify(metaRecord)]));
                    printToConsole(`[SUCCESS] CLOUD COMMIT VERIFIED.`);
                }

                const qrContainer = document.getElementById('qr-container');
                qrContainer.innerHTML = '';
                qrContainer.style.display = 'grid';
                window.activeShares = shares;

                shares.forEach((share, index) => {
                    const card = document.createElement('div');
                    card.className = 'qr-card';
                    card.innerHTML = `
                        <label>SHARD [${index + 1}/${N}]</label>
                        <textarea readonly style="width: 100%; height: 70px; resize: none; font-size: 0.6rem; padding: 0.4rem; background: #000; color: var(--fg-muted); border: 1px solid var(--border-faint);">${share}</textarea>
                    `;
                    qrContainer.appendChild(card);
                });

                document.getElementById('record-id').value = recordId;
                document.getElementById('shard-actions').style.display = 'grid';
                printToConsole(`[SUCCESS] KEY SHATTERED. ORIGINAL VECTOR DESTROYED.`);

            } catch (err) { printToConsole(`[FATAL] COMMIT FAILED: ${err.message}`); }
        }

        window.reconstructAndDecrypt = async function() {
            try {
                const recordId = document.getElementById('record-id').value.trim();
                const rawShards = document.getElementById('master-key-input').value.trim();
                const thresholdK = parseInt(document.getElementById('threshold').value) || 3;
                
                if (!recordId || !rawShards) throw new Error("IDENTIFIER AND SHARDS/CIPHER REQUIRED.");

                printToConsole("[SYS] VERIFYING QUORUM / CIPHER...");
                
                let keyBytes;
                if (rawShards.indexOf('\n') === -1 && rawShards.length === 64) {
                    keyBytes = new Uint8Array(rawShards.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                } else {
                    if (!window.secrets) throw new Error("MATH ENGINE MISSING.");
                    const shards = rawShards.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
                    
                    if (shards.length < thresholdK) {
                        throw new Error(`INSUFFICIENT QUORUM: Provided ${shards.length} shards, but threshold requires at least ${thresholdK}.`);
                    }

                    const recoveredHex = window.secrets.combine(shards);
                    if (!recoveredHex) throw new Error("QUORUM INTERPOLATION FAILED: Mismatched or corrupted shards.");
                    keyBytes = new Uint8Array(recoveredHex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                }

                const aesKey = await window.crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]);

                let vaultRecord, metaRecord;
                const storageMode = document.querySelector('input[name="storage"]:checked').value;

                if (window.IS_AIR_GAPPED || storageMode === 'local') {
                    vaultRecord = JSON.parse(localStorage.getItem(`vault_${recordId}`));
                    metaRecord = JSON.parse(localStorage.getItem(`meta_${recordId}`));
                } else {
                    printToConsole("[SYS] FETCHING ENCRYPTED ARTIFACTS...");
                    const { data: dFile, error: dErr } = await supabaseClient.storage.from('vault-store').download(`${recordId}.enc`);
                    if (dErr) throw new Error(`Cloud fetch failed: ${dErr.message}`);
                    vaultRecord = JSON.parse(await dFile.text());

                    const { data: mFile, error: mErr } = await supabaseClient.storage.from('vault-store').download(`${recordId}.meta`);
                    if (mErr) throw new Error(`Cloud metadata fetch failed: ${mErr.message}`);
                    metaRecord = JSON.parse(await mFile.text());
                }

                if (!vaultRecord || !metaRecord) throw new Error("Vault record not found in storage storage.");

                const metaBuf = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(metaRecord.iv) }, aesKey, new Uint8Array(metaRecord.ciphertext));
                const metadata = JSON.parse(new TextDecoder().decode(metaBuf));

                const payloadBuf = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(vaultRecord.iv) }, aesKey, new Uint8Array(vaultRecord.ciphertext));
                const decryptedStr = new TextDecoder().decode(payloadBuf);

                printToConsole(`[SUCCESS] EXTRACTION COMPLETE: ${metadata.originalName}`);

                try {
                    const parsedPayload = JSON.parse(decryptedStr);
                    if (parsedPayload && parsedPayload.isBinary) {
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.href = parsedPayload.data;
                        downloadAnchor.download = parsedPayload.name;
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        document.body.removeChild(downloadAnchor);
                        printToConsole(`[SUCCESS] FILE RECONSTRUCTED & DOWNLOADED: ${parsedPayload.name}`);
                        return;
                    }
                } catch (e) {}

                printToConsole(`[PAYLOAD]:\n${decryptedStr}`);

            } catch (err) { printToConsole(`[FATAL] EXTRACTION REJECTED: ${err.message}`); }
        }

        window.deleteVaultRecord = async function() {
            try {
                const recordId = document.getElementById('record-id').value.trim();
                const rawShards = document.getElementById('master-key-input').value.trim();
                if (!recordId || !rawShards) throw new Error("IDENTIFIER AND SHARDS/CIPHER REQUIRED.");

                if (rawShards.indexOf('\n') !== -1) {
                    const shards = rawShards.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
                    if (!window.secrets.combine(shards)) throw new Error("INVALID QUORUM.");
                }

                const storageMode = document.querySelector('input[name="storage"]:checked').value;
                if (window.IS_AIR_GAPPED || storageMode === 'local') {
                    localStorage.removeItem(`vault_${recordId}`);
                    localStorage.removeItem(`meta_${recordId}`);
                } else {
                    await supabaseClient.storage.from('vault-store').remove([`${recordId}.enc`, `${recordId}.meta`]);
                }
                printToConsole(`[SUCCESS] RECORD ${recordId} ANNIHILATED.`);
            } catch (err) { printToConsole(`[FATAL] BURN FAILED: ${err.message}`); }
        }

        window.downloadShards = function() {
            try {
                if (!window.activeShares || window.activeShares.length === 0) throw new Error("No active shards in memory.");
                window.activeShares.forEach((share, index) => {
                    const blob = new Blob([share], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const anchor = document.createElement('a');
                    anchor.href = url;
                    anchor.download = `vault_shard_${index + 1}_of_${window.activeShares.length}.key`;
                    document.body.appendChild(anchor);
                    anchor.click();
                    document.body.removeChild(anchor);
                    URL.revokeObjectURL(url);
                });
                printToConsole("[SUCCESS] KEY FILES EXPORTED TO LOCAL FILESYSTEM.");
            } catch (err) { printToConsole(`[ERROR] EXPORT FAILED: ${err.message}`); }
        }
    </script>
</body>
